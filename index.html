<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>독일어 학회 ZD - 공식 링크 허브</title>
    <style>
        :root {
            --de-black: #1a1a1a;
            --de-red: #e53935;
            --de-gold: #ffc107;
            --bg-color: #f8f9fa;
        }
        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header-bg {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, var(--de-black) 33%, var(--de-red) 33%, var(--de-red) 66%, var(--de-gold) 66%);
            position: absolute;
            top: 0;
            z-index: -1;
        }
        .profile-container {
            margin-top: 100px;
            text-align: center;
            background: white;
            padding: 30px 20px;
            border-radius: 20px;
            width: 85%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .profile-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--de-black);
            margin: 0;
            letter-spacing: -0.5px;
        }
        .profile-subtitle {
            font-size: 1rem;
            color: #666;
            margin-top: 10px;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .link-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }
        .link-item {
            display: block;
            width: 100%;
            padding: 16px 0;
            background-color: white;
            color: var(--de-black);
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            transition: all 0.2s ease-in-out;
            box-sizing: border-box;
        }
        .link-item:hover {
            border-color: var(--de-red);
            background-color: #fff5f5;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(229, 57, 53, 0.1);
        }
        .highlight {
            background-color: var(--de-black);
            color: white;
            border-color: var(--de-black);
        }
        .highlight:hover {
            background-color: #333;
            color: white;
            border-color: #333;
        }
        .footer {
            margin-top: auto;
            padding: 30px 20px;
            font-size: 0.85rem;
            color: #888;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header-bg"></div>

    <div class="profile-container">
        <h1 class="profile-title">독일어 학회 ZD</h1>
        <p class="profile-subtitle">Goethe-Zertifikat 자격증 취득을 위한<br>서강대학교 독일어 학회입니다.</p>
        
        <div class="link-list">
            <a href="#" class="link-item highlight">📝 2026학년도 신입 학회원 지원서</a>
            <a href="#" class="link-item">💬 학회 공지사항 카카오톡 방</a>
            
            <div style="margin: 10px 0; border-top: 1px dashed #ddd;"></div>
            
            <a href="#" class="link-item">📊 독일어 실력 진단 테스트 (A1-B2)</a>
            <a href="#" class="link-item">🔥 A1 필수 어휘 랜덤 테스트</a>
            <a href="#" class="link-item">🚀 A2 필수 어휘 무한 모의고사</a>
            
            <div style="margin: 10px 0; border-top: 1px dashed #ddd;"></div>
            
            <a href="#" class="link-item">📚 서강대 유럽문화학과 족보 아카이브</a>
        </div>
    </div>

    <div class="footer">
        매주 목요일 18:00 ~ 19:00 정기 모임<br>
        ⓒ 2026 ZD. All rights reserved.
    </div>

</body>
</html>
